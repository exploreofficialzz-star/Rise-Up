  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }

    flt-glass-pane {
      z-index: 10 !important;
    }

    /*
     * #loading is now just a black background shown during Flutter's
     * engine bootstrap (~300–800ms on web). It vanishes the instant
     * Flutter paints its first frame, handing off to SplashScreen.dart
     * which owns the full 5.5s branded experience on ALL platforms.
     */
    #loading {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 99999;
      transition: opacity 0.2s ease;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Plain black screen during engine bootstrap only.
       SplashScreen.dart takes over the moment Flutter renders. -->
  <div id="loading"></div>

  <script>
    function hideSplash() {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 250);
      }
    }

    // Hide the instant Flutter paints — SplashScreen.dart takes over
    window.addEventListener('flutter-first-frame', hideSplash);

    // Hard fallback — should never be needed
    setTimeout(hideSplash, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
