<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>RiseUp — AI Wealth Mentor</title>
  <meta name="description" content="Your AI-powered wealth mentor. Go from survival mode to financial freedom with personalised income tasks, skill building & a wealth roadmap. By ChAs Tech Group.">
  <meta name="keywords" content="wealth building, income, AI mentor, financial freedom, Nigeria, skills, freelancing">
  <meta name="author" content="ChAs Tech Group">
  <meta name="theme-color" content="#6C5CE7">

  <meta property="og:title" content="RiseUp — AI Wealth Mentor">
  <meta property="og:description" content="Go from survival mode to financial freedom with your AI wealth mentor.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RiseUp — AI Wealth Mentor">
  <meta name="twitter:description" content="AI-powered income tasks, skill building & wealth roadmaps.">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      /* Match Flutter splash background so there's zero flash */
      background-color: #000000;
      overflow: hidden;
    }

    flt-glass-pane {
      z-index: 10 !important;
    }

    /* Loading div is invisible — Flutter splash_screen.dart owns the UI.
       We keep the div in the DOM only because flutter_bootstrap.js expects
       it to exist; it is removed the instant Flutter's first frame fires. */
    #loading {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Intentionally invisible — Flutter splash_screen.dart is the splash for
       both mobile AND web. This div is kept solely so flutter_bootstrap.js
       has something to hand off from. -->
  <div id="loading"></div>

  <script>
    // Remove the placeholder the moment Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });

    // Safety fallback — remove after 10s no matter what
    setTimeout(function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    }, 10000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
