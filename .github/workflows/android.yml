name: Android Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options: [apk, aab, both]

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Java (Required for Android builds)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ✅ Flutter setup
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      # ✅ Cache dependencies (speeds up builds)
      - name: Cache Flutter & Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            frontend/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('frontend/pubspec.lock') }}

      # ✅ Clean project
      - name: Clean Flutter project
        working-directory: frontend
        run: flutter clean

      # ✅ Install dependencies
      - name: Get dependencies
        working-directory: frontend
        run: flutter pub get

      # ✅ Decode keystore
      - name: Decode keystore
        working-directory: frontend/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > riseup-release.jks

      # ✅ Create key.properties
      - name: Create key.properties
        working-directory: frontend/android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=riseup-release.jks
          EOF

      # ✅ Firebase config
      - name: Decode google-services.json
        working-directory: frontend/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json

      # =========================
      # ✅ BUILD APK
      # =========================
      - name: Build APK
        if: ${{ github.event.inputs.build_type != 'aab' }}
        working-directory: frontend
        env:
          # Core
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # AdMob — env var names match GitHub secret names
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          # Shared ad unit IDs (used as fallback by AppConstants)
          BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT }}
          INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT }}
          REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT }}
          NATIVE_AD_UNIT_ID: ${{ secrets.NATIVE_AD_UNIT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=ADMOB_APP_ID=$ADMOB_APP_ID \
            --dart-define=BANNER_AD_UNIT_ID=$BANNER_AD_UNIT_ID \
            --dart-define=INTERSTITIAL_AD_UNIT_ID=$INTERSTITIAL_AD_UNIT_ID \
            --dart-define=REWARDED_AD_UNIT_ID=$REWARDED_AD_UNIT_ID \
            --dart-define=NATIVE_AD_UNIT_ID=$NATIVE_AD_UNIT_ID

      # =========================
      # ✅ BUILD AAB (PLAY STORE)
      # =========================
      - name: Build AAB
        if: ${{ github.event.inputs.build_type != 'apk' || startsWith(github.ref, 'refs/tags/') }}
        working-directory: frontend
        env:
          # Core
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # AdMob
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT }}
          INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT }}
          REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT }}
          NATIVE_AD_UNIT_ID: ${{ secrets.NATIVE_AD_UNIT_ID }}
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=ADMOB_APP_ID=$ADMOB_APP_ID \
            --dart-define=BANNER_AD_UNIT_ID=$BANNER_AD_UNIT_ID \
            --dart-define=INTERSTITIAL_AD_UNIT_ID=$INTERSTITIAL_AD_UNIT_ID \
            --dart-define=REWARDED_AD_UNIT_ID=$REWARDED_AD_UNIT_ID \
            --dart-define=NATIVE_AD_UNIT_ID=$NATIVE_AD_UNIT_ID

      # =========================
      # ✅ UPLOAD ARTIFACTS
      # =========================
      - name: Upload APK
        if: ${{ github.event.inputs.build_type != 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: riseup-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type != 'apk' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: riseup-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab

      # =========================
      # ✅ GITHUB RELEASE
      # =========================
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: RiseUp ${{ github.ref_name }}
          files: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
